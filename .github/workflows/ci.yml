name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RiotSwitcher.sln

      - name: Build
        run: dotnet build RiotSwitcher.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/RiotSwitcher.Core.Tests/RiotSwitcher.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
